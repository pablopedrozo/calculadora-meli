# Configuración de Frigate: grabación 24/7 + detección de personas con IA.
# Reemplazar las IPs y credenciales de las cámaras (ver docs/GUIA_INSTALACION.md, paso 5).

mqtt:
  host: mosquitto
  port: 1883
  topic_prefix: frigate

# Detección por IA usando la GPU integrada Intel (OpenVINO).
# No hace falta Google Coral con 2-4 cámaras.
detectors:
  ov:
    type: openvino
    device: GPU

model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

# Aceleración de video por hardware (Intel Quick Sync)
ffmpeg:
  hwaccel_args: preset-vaapi

# Solo nos interesan personas (evita falsas alarmas por perros, gatos, autos)
objects:
  track:
    - person
  filters:
    person:
      min_score: 0.6
      threshold: 0.72

# Grabación continua + retención de eventos con personas
record:
  enabled: true
  retain:
    days: 7          # 7 días de grabación continua (subir si el disco alcanza)
    mode: all
  alerts:
    retain:
      days: 30       # los clips con personas detectadas se guardan 30 días
  detections:
    retain:
      days: 30

snapshots:
  enabled: true
  bounding_box: true
  retain:
    default: 30

# ============ CÁMARAS ============
# Duplicar el bloque por cada cámara. Formato RTSP Dahua:
#   rtsp://USUARIO:CLAVE@IP:554/cam/realmonitor?channel=1&subtype=0   (HD, para grabar)
#   rtsp://USUARIO:CLAVE@IP:554/cam/realmonitor?channel=1&subtype=1   (baja, para detectar)
# Formato Hikvision:
#   rtsp://USUARIO:CLAVE@IP:554/Streaming/Channels/101  (HD)
#   rtsp://USUARIO:CLAVE@IP:554/Streaming/Channels/102  (baja)
cameras:
  frente:
    ffmpeg:
      inputs:
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.101:554/cam/realmonitor?channel=1&subtype=0
          roles:
            - record
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.101:554/cam/realmonitor?channel=1&subtype=1
          roles:
            - detect
    detect:
      width: 704
      height: 480
      fps: 5

  patio:
    ffmpeg:
      inputs:
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.102:554/cam/realmonitor?channel=1&subtype=0
          roles:
            - record
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.102:554/cam/realmonitor?channel=1&subtype=1
          roles:
            - detect
    detect:
      width: 704
      height: 480
      fps: 5

version: 0.14

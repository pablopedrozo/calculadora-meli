<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Carga de Stock</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --ink:#111827; --muted:#6b7280;
    --line:#e5e7eb; --accent:#2563eb; --accent-ink:#ffffff;
    --ok:#059669; --danger:#dc2626; --chip:#eef2ff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1115; --card:#181b21; --ink:#f3f4f6; --muted:#9ca3af;
      --line:#2a2e36; --accent:#3b82f6; --accent-ink:#ffffff;
      --ok:#10b981; --danger:#f87171; --chip:#1e2634;
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:12px 12px 90px; max-width:560px; margin-inline:auto;
  }
  h1{font-size:1.15rem; margin:4px 0 2px;}
  .sub{color:var(--muted); font-size:.8rem; margin:0 0 12px;}

  .panel{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:12px;}

  .qty-row{display:flex; gap:8px; align-items:stretch;}
  #qty{
    flex:1; min-width:0; font-size:2rem; font-weight:700; text-align:center;
    border:2px solid var(--accent); border-radius:12px; padding:8px;
    background:var(--card); color:var(--ink);
  }
  .qty-btn{
    font-size:1.3rem; font-weight:700; border:1px solid var(--line); background:var(--chip);
    color:var(--ink); border-radius:12px; width:56px; cursor:pointer;
  }
  .hint{color:var(--muted); font-size:.78rem; margin:8px 0 0; text-align:center;}

  .sizes{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:10px;}
  .size-btn{
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:14px; padding:10px 6px 12px; cursor:pointer; text-align:center;
    transition:transform .05s;
  }
  .size-btn:active{transform:scale(.95); border-color:var(--accent);}
  .size-btn .tag{font-size:1.25rem; font-weight:800;}
  .size-btn .count{font-size:1.6rem; font-weight:800; color:var(--accent); display:block; margin-top:2px;}
  .size-btn .plus{font-size:.72rem; color:var(--muted);}

  .totalbar{
    position:fixed; left:0; right:0; bottom:0; background:var(--card);
    border-top:1px solid var(--line); padding:10px 16px;
    display:flex; justify-content:space-between; align-items:center;
    max-width:560px; margin-inline:auto;
  }
  .totalbar .n{font-size:1.5rem; font-weight:800; color:var(--ok);}

  .actions{display:flex; gap:8px; flex-wrap:wrap;}
  .btn{
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:10px; padding:8px 12px; font-size:.85rem; cursor:pointer;
  }
  .btn.danger{color:var(--danger); border-color:var(--danger);}
  .btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}

  #log{list-style:none; margin:8px 0 0; padding:0; font-size:.85rem;}
  #log li{
    display:flex; justify-content:space-between; padding:6px 2px;
    border-bottom:1px dashed var(--line); color:var(--muted);
  }
  #log li b{color:var(--ink);}
  .flash{animation:flash .4s;}
  @keyframes flash{0%{background:var(--chip);}100%{background:var(--card);}}
  details summary{cursor:pointer; color:var(--muted); font-size:.85rem;}
</style>
</head>
<body>
  <h1>📦 Carga de Stock por Talle</h1>
  <p class="sub">Poné la cantidad de la caja y tocá el talle: se suma al total. Todo queda guardado solo.</p>

  <div class="panel">
    <div class="qty-row">
      <button class="qty-btn" id="minus" type="button">−</button>
      <input id="qty" type="number" inputmode="numeric" min="1" value="1">
      <button class="qty-btn" id="plus" type="button">+</button>
    </div>
    <div class="sizes" id="sizes"></div>
    <p class="hint">Tip: si la caja trae 24, escribí 24 y tocá el talle. Para contar de a una, dejá 1.</p>
  </div>

  <div class="panel">
    <div class="actions">
      <button class="btn" id="undo" type="button">↩️ Deshacer última</button>
      <button class="btn" id="addSize" type="button">＋ Agregar talle</button>
      <button class="btn" id="copy" type="button">📋 Copiar resumen</button>
      <button class="btn danger" id="reset" type="button">🗑️ Reiniciar todo</button>
    </div>
    <details>
      <summary>Historial de cargas</summary>
      <ul id="log"></ul>
    </details>
  </div>

  <div class="totalbar">
    <span>Total unidades</span>
    <span class="n" id="total">0</span>
  </div>

<script>
(function(){
  var KEY = 'stock-talles-v1';
  var state = load() || {
    sizes: ['S','M','L','XL','XXL'],
    counts: {},
    log: []
  };

  function load(){
    try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return null; }
  }
  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
  }

  var $sizes = document.getElementById('sizes');
  var $qty = document.getElementById('qty');
  var $total = document.getElementById('total');
  var $log = document.getElementById('log');

  function getQty(){
    var n = parseInt($qty.value, 10);
    return (isNaN(n) || n < 1) ? 1 : n;
  }

  function render(){
    $sizes.innerHTML = '';
    state.sizes.forEach(function(t){
      var c = state.counts[t] || 0;
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'size-btn';
      b.innerHTML = '<span class="tag">' + t + '</span>' +
                    '<span class="count">' + c + '</span>' +
                    '<span class="plus">tocar para sumar</span>';
      b.onclick = function(){
        var q = getQty();
        state.counts[t] = (state.counts[t] || 0) + q;
        state.log.push({ t: t, q: q, at: new Date().toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'}) });
        save(); render();
      };
      $sizes.appendChild(b);
    });

    var total = 0;
    state.sizes.forEach(function(t){ total += (state.counts[t] || 0); });
    $total.textContent = total;

    $log.innerHTML = '';
    state.log.slice().reverse().forEach(function(e){
      var li = document.createElement('li');
      li.innerHTML = '<span>+' + e.q + ' en <b>' + e.t + '</b></span><span>' + e.at + '</span>';
      $log.appendChild(li);
    });
  }

  document.getElementById('minus').onclick = function(){
    $qty.value = Math.max(1, getQty() - 1);
  };
  document.getElementById('plus').onclick = function(){
    $qty.value = getQty() + 1;
  };
  $qty.addEventListener('focus', function(){ $qty.select(); });

  document.getElementById('undo').onclick = function(){
    var e = state.log.pop();
    if (!e) return;
    state.counts[e.t] = Math.max(0, (state.counts[e.t] || 0) - e.q);
    save(); render();
  };

  document.getElementById('addSize').onclick = function(){
    var t = prompt('Nombre del talle (ej: 3XL, 40, Único):');
    if (!t) return;
    t = t.trim().toUpperCase();
    if (!t || state.sizes.indexOf(t) !== -1) return;
    state.sizes.push(t);
    save(); render();
  };

  document.getElementById('copy').onclick = function(){
    var lines = ['Stock por talle:'];
    var total = 0;
    state.sizes.forEach(function(t){
      var c = state.counts[t] || 0;
      total += c;
      if (c > 0) lines.push(t + ': ' + c);
    });
    lines.push('TOTAL: ' + total);
    var txt = lines.join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function(){ alert('Resumen copiado ✅'); }, function(){ prompt('Copiá el resumen:', txt); });
    } else {
      prompt('Copiá el resumen:', txt);
    }
  };

  document.getElementById('reset').onclick = function(){
    if (!confirm('¿Borrar todos los conteos y empezar de cero?')) return;
    state.counts = {};
    state.log = [];
    save(); render();
  };

  render();
})();
</script>
</body>
</html>
